<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F5922F"/>
      <stop offset="100%" stop-color="#D4530A"/>
    </linearGradient>
  </defs>

  <!-- Main L shape: vertical bar (left) + horizontal bar (bottom) -->
  <!-- Top of vertical bar has a diagonal cut at the top-right corner -->
  <polygon points="0,0 24,0 40,18 40,65 100,65 100,100 0,100" fill="url(#g)"/>

  <!-- Small triangle, top-right corner (mirrors the diagonal cut) -->
  <polygon points="58,0 100,0 100,42" fill="url(#g)"/>
</svg>
